<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="nextGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="nestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="960" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">文档摄取管线：Next 入队 · Postgres 队列 · Nest 处理器</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#64748b">FOR UPDATE SKIP LOCKED · 版本乐观锁 · 指数退避</text>

  <!-- ============ Next (enqueue) ============ -->
  <g>
    <rect x="40" y="110" width="250" height="220" rx="12" fill="url(#nextGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="40" y="110" width="250" height="34" rx="12" fill="#334155"/>
    <rect x="40" y="128" width="250" height="16" fill="#334155"/>
    <text x="165" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Next.js · 浏览器面向（入队）</text>

    <rect x="64" y="164" width="202" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="165" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">POST /api/documents</text>
    <text x="165" y="197" text-anchor="middle" font-size="11" fill="#64748b">用户上传文档</text>

    <text x="76" y="232" font-size="12" fill="#334155">① 建 Document（status=QUEUED）</text>
    <text x="76" y="256" font-size="12" fill="#334155">② 建 IngestionJob（幂等键去重）</text>
    <text x="76" y="280" font-size="12" fill="#334155">③ 归档源文件到 Supabase</text>
    <rect x="64" y="294" width="202" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="165" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">④ 立即返回 202 Accepted</text>
  </g>

  <!-- ============ Postgres queue ============ -->
  <g>
    <rect x="355" y="110" width="250" height="220" rx="12" fill="url(#dbGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="480" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">PostgreSQL = 队列</text>
    <text x="480" y="158" text-anchor="middle" font-size="11" fill="#3b82f6">无需 Redis / MQ</text>

    <!-- IngestionJob table rows -->
    <rect x="380" y="176" width="200" height="122" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="392" y="194" font-size="12" font-weight="700" fill="#1e293b">"IngestionJob"</text>
    <line x1="380" y1="202" x2="580" y2="202" stroke="#e2e8f0"/>
    <g font-size="11" fill="#475569">
      <rect x="388" y="210" width="184" height="18" rx="3" fill="#f1f5f9"/>
      <text x="396" y="223">job#1 · QUEUED · availableAt≤now</text>
      <rect x="388" y="232" width="184" height="18" rx="3" fill="#f1f5f9"/>
      <text x="396" y="245">job#2 · QUEUED</text>
      <rect x="388" y="254" width="184" height="18" rx="3" fill="#fef9c3"/>
      <text x="396" y="267">job#3 · RETRY · 退避中</text>
      <rect x="388" y="276" width="184" height="18" rx="3" fill="#fee2e2"/>
      <text x="396" y="289">job#4 · PROCESSING · 锁 15min↑</text>
    </g>
    <text x="480" y="316" text-anchor="middle" font-size="10.5" fill="#3b82f6">availableAt / lockedAt / attempt / version</text>
  </g>

  <!-- ============ Nest processor ============ -->
  <g>
    <rect x="670" y="110" width="250" height="220" rx="12" fill="url(#nestGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="670" y="110" width="250" height="34" rx="12" fill="#b91c1c"/>
    <rect x="670" y="128" width="250" height="16" fill="#b91c1c"/>
    <text x="795" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fef2f2">NestJS · 后台处理器</text>

    <rect x="694" y="164" width="202" height="40" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="795" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">POST /api/ingestion/process</text>
    <text x="795" y="197" text-anchor="middle" font-size="11" fill="#64748b">worker 触发 · @Public + secret</text>

    <text x="706" y="232" font-size="12" fill="#334155">① 领任务（SKIP LOCKED）</text>
    <text x="706" y="256" font-size="12" fill="#334155">② 切块 + 并行嵌入</text>
    <text x="706" y="280" font-size="12" fill="#334155">③ 单事务写库（乐观锁）</text>
    <rect x="694" y="294" width="202" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="795" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">④ 标记 COMPLETED</text>
  </g>

  <!-- flow arrows top -->
  <path d="M290,220 L350,220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="320" y="212" text-anchor="middle" font-size="10" fill="#64748b">入队</text>
  <path d="M665,220 L610,220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="637" y="212" text-anchor="middle" font-size="10" fill="#64748b">领取</text>
  <path d="M610,250 L665,250" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowLight)"/>
  <text x="637" y="268" text-anchor="middle" font-size="10" fill="#94a3b8">回写</text>

  <!-- ============ Concurrency detail ============ -->
  <text x="480" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">核心机制 · 多 worker 并发领取零冲突</text>

  <!-- workers -->
  <g>
    <rect x="60" y="404" width="150" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="135" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">3 个 worker 同时抢</text>
    <g font-size="11.5">
      <rect x="76" y="438" width="118" height="30" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="86" y="457" fill="#334155">worker A → 锁 job#1</text>
      <rect x="76" y="474" width="118" height="30" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="86" y="493" fill="#334155">worker B → SKIP→job#2</text>
      <rect x="76" y="510" width="118" height="30" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="86" y="529" fill="#334155">worker C → SKIP→job#3</text>
    </g>
  </g>

  <path d="M215,479 L255,479" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- SQL box -->
  <g>
    <rect x="262" y="404" width="436" height="150" rx="10" fill="#0f172a"/>
    <text x="280" y="428" font-size="12" font-weight="700" fill="#f8fafc">claimNextJob() — 一条原子 UPDATE</text>
    <g font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="11.5" fill="#e2e8f0">
      <text x="280" y="452"><tspan fill="#c792ea">UPDATE</tspan> "IngestionJob" <tspan fill="#c792ea">SET</tspan> status=<tspan fill="#c3e88d">'PROCESSING'</tspan>,</text>
      <text x="298" y="470">attempt=attempt+1, lockedAt=<tspan fill="#82aaff">NOW()</tspan></text>
      <text x="280" y="488"><tspan fill="#c792ea">WHERE</tspan> id = (<tspan fill="#c792ea">SELECT</tspan> id <tspan fill="#c792ea">FROM</tspan> "IngestionJob"</text>
      <text x="298" y="506">... <tspan fill="#c792ea">ORDER BY</tspan> availableAt <tspan fill="#c792ea">ASC</tspan></text>
      <text x="298" y="524" font-weight="700" fill="#ffcb6b">FOR UPDATE SKIP LOCKED <tspan fill="#c792ea">LIMIT</tspan> 1)</text>
      <text x="280" y="542"><tspan fill="#c792ea">RETURNING</tspan> id, documentId, version, attempt ...</text>
    </g>
  </g>

  <path d="M703,479 L735,479" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- result -->
  <g>
    <rect x="742" y="404" width="178" height="150" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="831" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">结果</text>
    <text x="831" y="452" text-anchor="middle" font-size="12" fill="#166534">各领各的</text>
    <text x="831" y="474" text-anchor="middle" font-size="12" fill="#166534">零重复</text>
    <text x="831" y="496" text-anchor="middle" font-size="12" fill="#166534">零等待</text>
    <text x="831" y="518" text-anchor="middle" font-size="11" fill="#15803d">被锁的行直接跳过，</text>
    <text x="831" y="533" text-anchor="middle" font-size="11" fill="#15803d">不阻塞</text>
  </g>

  <!-- ============ Three guarantees ============ -->
  <g>
    <rect x="40" y="586" width="280" height="104" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="60" y="612" font-size="13" font-weight="700" fill="#92400e">① 版本乐观锁</text>
    <text x="60" y="634" font-size="11.5" fill="#78350f">写库 WHERE version=X</text>
    <text x="60" y="652" font-size="11.5" fill="#78350f">影响行数 ≠ 1 → 抛错回滚</text>
    <text x="60" y="674" font-size="11.5" fill="#78350f">处理期间文档被改则作废</text>
  </g>
  <g>
    <rect x="340" y="586" width="280" height="104" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="360" y="612" font-size="13" font-weight="700" fill="#991b1b">② 指数退避重试</text>
    <text x="360" y="634" font-size="11.5" fill="#7f1d1d">delay = 30s × 2^(attempt-1)</text>
    <text x="360" y="652" font-size="11.5" fill="#7f1d1d">availableAt 控制可见性</text>
    <text x="360" y="674" font-size="11.5" fill="#7f1d1d">无需定时器 · 不打爆下游</text>
  </g>
  <g>
    <rect x="640" y="586" width="280" height="104" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="660" y="612" font-size="13" font-weight="700" fill="#1e40af">③ 单事务原子写</text>
    <text x="660" y="634" font-size="11.5" fill="#1e3a8a">更新 Document + 换 chunk</text>
    <text x="660" y="652" font-size="11.5" fill="#1e3a8a">+ 标任务完成，全在一事务</text>
    <text x="660" y="674" font-size="11.5" fill="#1e3a8a">全有或全无 · 无脏状态</text>
  </g>
</svg>
